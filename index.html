<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #3a1c71, #d76d77, #ffaf7b);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
      opacity: 0.1;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px) saturate(180%);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      font-weight: 800;
      margin-bottom: 10px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
      }
      to {
        text-shadow: 0 0 20px rgba(255,255,255,1);
      }
    }

    h2 {
      font-size: 1.5em;
      color: #ffd95a;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 30px;
      color: #f5f5f5;
    }

    a {
      text-decoration: none;
      display: inline-block;
      background: linear-gradient(90deg, #ff8a00, #da1b60);
      color: white;
      padding: 15px 45px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.1em;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(218, 27, 96, 0.5);
    }

    a:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(255, 138, 0, 0.7);
    }

    a:active {
      transform: scale(0.95);
    }

    @media screen and (max-width: 480px) {
      h1 {
        font-size: 2em;
      }
      h2 {
        font-size: 1.2em;
      }
      p {
        font-size: 1em;
      }
      a {
        padding: 12px 30px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to PDF Viewer</h1>
    <h2>Access Your PDF</h2>
    <p>Click the button below to open your document:</p>
    <a href="https://drive.google.com/file/d/1TvwKndPI_s7Tc4JzSD3p1AfSBAb89dD_/view?usp=drivesdk" target="_blank">
      Open PDF
    </a>
  </div>
</body>
</html>
