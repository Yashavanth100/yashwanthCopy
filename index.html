<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For ANU ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
text-align:center;
color:#fff;
background:linear-gradient(-45deg,#ff4d6d,#ff85a2,#ffb6c1,#ffd6e7);
background-size:400% 400%;
animation:bg 10s infinite alternate;
overflow-x:hidden;
}
@keyframes bg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}
h1{
margin-top:40px;
font-size:40px;
text-shadow:0 0 20px white;
}
#msg{
padding:20px;
font-size:22px;
line-height:1.8;
max-width:700px;
margin:auto;
}
#kisses{
font-size:32px;
word-break:break-all;
padding:20px;
}
.heart{
position:fixed;
font-size:25px;
animation:fall 8s linear infinite;
pointer-events:none;
}
@keyframes fall{
from{transform:translateY(-100px);}
to{transform:translateY(110vh);}
}
footer{
padding:40px;
font-size:24px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>💖 ANU ❤️ YASH 💖</h1>

<div id="msg"></div>

<div id="kisses"></div>

<footer>
Forever Yours ❤️<br>
Your Yash 🫂
</footer>

<script>

const text=`Dear ANU ❤️,

Every scroll on this page is another kiss from me. 💋

No matter how many kisses appear here...

They will never be enough to tell you how much I love you.

You are my smile.
My peace.
My happiness.
My forever.

I Love You Infinite Times.

❤️ Your Yash ❤️`;

let i=0;

function type(){
if(i<text.length){
msg.innerHTML+=text.charAt(i);
i++;
setTimeout(type,35);
}
}
type();

function addKiss(){
let p=document.createElement("p");
p.innerHTML="💋".repeat(300);
kisses.appendChild(p);
}

for(let i=0;i<5;i++) addKiss();

window.onscroll=()=>{
if(window.innerHeight+scrollY>=document.body.offsetHeight-200){
addKiss();
}
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML=Math.random()>0.5?"❤️":"💖";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(5+Math.random()*4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),9000);
},300);

</script>

</body>
</html>
