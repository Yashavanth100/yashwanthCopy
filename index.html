<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Unlimited Kisses 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(-45deg,#ff4d6d,#ff85a2,#ffd6e0,#ffc2d1);
background-size:400% 400%;
animation:bg 12s ease infinite;
font-family:Arial,sans-serif;
overflow-x:hidden;
text-align:center;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
margin-top:40px;
font-size:42px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 30px hotpink;}
}

#msg{
font-size:26px;
margin:20px;
min-height:80px;
font-weight:bold;
}

#kisses{
font-size:35px;
line-height:1.8;
padding:20px;
word-break:break-word;
}

.heart{
position:fixed;
font-size:30px;
animation:float 8s linear infinite;
opacity:.8;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}
30%{opacity:1;}
100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}
}

footer{
padding:40px;
font-size:24px;
font-weight:bold;
color:#fff;
text-shadow:0 0 15px white;
}
</style>
</head>

<body>

<h1>💖 Unlimited Kisses 💖</h1>

<div id="msg"></div>

<div id="kisses"></div>

<footer>
Forever Yours ❤️<br>
— Your Yash 🫂
</footer>

<script>

const text="Every scroll is another kiss from me. 💋❤️ I wish I could be there to kiss your forehead, hold your hand and make you smile forever. You are my happiest place. 🥹❤️";

let i=0;

function typing(){
if(i<text.length){
document.getElementById("msg").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,45);
}
}

typing();

const kisses=document.getElementById("kisses");

function addKiss(){
const p=document.createElement("p");
p.innerHTML="💋".repeat(500);
kisses.appendChild(p);
}

for(let i=0;i<10;i++) addKiss();

window.addEventListener("scroll",()=>{
if(window.innerHeight+window.scrollY>=document.body.offsetHeight-300){
addKiss();
}
});

function heart(){
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(h);

setTimeout(()=>h.remove(),9000);
}

setInterval(heart,300);

</script>

</body>
</html>
